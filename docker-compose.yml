# Docker Compose for Goala
# Services: PostgreSQL (pgvector), FastAPI Backend, React Frontend

services:
  # =============================================================================
  # PostgreSQL Database with pgvector extension
  # =============================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: goala-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-goala}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./docker/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-goala}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - goala-network

  # =============================================================================
  # FastAPI Backend (RAG Service)
  # =============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goala-api
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-goala}
      - HF_HOME=/app/huggingface_cache
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src  
      - ./data:/app/data:ro
      - ./shared:/app/shared
      - huggingface_cache:/app/huggingface_cache
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Longer start period for model loading
    networks:
      - goala-network

  # =============================================================================
  # Frontend (React Admin Panel)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goala-frontend
    env_file: .env
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - goala-network

# =============================================================================
# Networks
# =============================================================================
networks:
  goala-network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgvector_data:
    name: goala-pgvector-data
  huggingface_cache:
    name: goala-huggingface-cache
